name: Build Lucreticus Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to build for (or all)'
        required: true
        default: 'a32'
        type: choice
        options:
          - a32
          - a22
          - f22
          - m22
          - m32
          - all
      ksu:
        description: 'Add KernelSU?'
        required: true
        default: false
        type: boolean
      profile:
        description: 'Tuning profile (perf, balance, battery, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - perf
          - balance
          - battery
          - all
      opt:
        description: 'Compiler optimization level'
        required: true
        default: 'O3'
        type: choice
        options:
          - O2
          - O3
      droidspaces:
        description: 'Add Droidspaces container support?'
        required: true
        default: true
        type: boolean
      nomount:
        description: 'Add nomount mountpoint-hiding hooks?'
        required: true
        default: true
        type: boolean
      lto:
        description: 'Link-Time Optimization [EXPERIMENT]'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - thin
          - full
      zen:
        description: 'Use Zen I/O scheduler as default?'
        required: true
        default: false
        type: boolean
      aio_opt:
        description: 'Enable AIO completion optimizations?'
        required: true
        default: true
        type: boolean
      wireguard:
        description: 'Add in-kernel WireGuard support?'
        required: true
        default: false
        type: boolean
      nosec:
        description: 'Strip Samsung security layer? [EXPERIMENT]'
        required: true
        default: false
        type: boolean
      nodebug:
        description: 'Strip DEBUG configs? [EXPERIMENT]'
        required: true
        default: false
        type: boolean
      use_cache:
        description: 'Reuse last out/ cache? [EXPERIMENT]'
        required: true
        default: false
        type: boolean
      bypass_charging:
        description: 'Enable bypass charging? [EXPERIMENT]'
        required: true
        default: false
        type: boolean
      docker:
        description: 'Enable Docker/LXC support? [EXPERIMENT]'
        required: true
        default: true
        type: boolean
      clock:
        description: 'CPU clock mode [EXPERIMENT]'
        required: true
        default: 'stock'
        type: choice
        options:
          - stock
          - overclock
          - downclock
      hz:
        description: 'Tick rate (HZ) [EXPERIMENT]'
        required: true
        default: '250'
        type: choice
        options:
          - '100'
          - '250'
          - '300'
          - '1000'
      gpu_clock:
        description: 'GPU clock mode [EXPERIMENT]'
        required: true
        default: 'stock'
        type: choice
        options:
          - stock
          - overclock
          - downclock
          - max

permissions:
  contents: write

jobs:
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.set.outputs.profiles }}
      devices: ${{ steps.set.outputs.devices }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.profile }}" = "all" ]; then
            echo 'profiles=["perf", "balance", "battery"]' >> $GITHUB_OUTPUT
          else
            echo "profiles=[\"${{ inputs.profile }}\"]" >> $GITHUB_OUTPUT
          fi
          if [ "${{ inputs.device }}" = "all" ]; then
            echo 'devices=["a32", "a22", "f22", "m22", "m32"]' >> $GITHUB_OUTPUT
          else
            echo "devices=[\"${{ inputs.device }}\"]" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Kernel ${{ matrix.device }} ${{ matrix.profile }} ${{ inputs.opt }} ${{ inputs.ksu && 'with KernelSU' || 'standard' }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: ${{ fromJSON(needs.setup.outputs.profiles) }}
        device: ${{ fromJSON(needs.setup.outputs.devices) }}

    env:
      DEVICE_CHOICE: ${{ matrix.device }}
      KSU_CHOICE: ${{ inputs.ksu }}
      PROFILE_CHOICE: ${{ matrix.profile }}

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential bc bison flex patch pkg-config git curl tar xz-utils zip unzip \
            cpio rsync kmod perl python3 python-is-python3 libssl-dev libelf-dev pahole lld \
            libncurses-dev zlib1g-dev libyaml-dev lz4 zstd device-tree-compiler adb fastboot

      - name: Download Toolchain (ZyC Clang 14)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          curl -Ls https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz -o Clang-14.0.6-20250704.tar.gz
          tar -xf Clang-14.0.6-20250704.tar.gz -C $GITHUB_WORKSPACE/clang
          rm Clang-14.0.6-20250704.tar.gz

      - name: Restore out cache
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: out
          key: out-${{ matrix.device }}-${{ matrix.profile }}-${{ inputs.opt }}-${{ inputs.ksu }}-${{ inputs.lto }}-${{ inputs.zen }}-${{ inputs.aio_opt }}-${{ inputs.wireguard }}-${{ inputs.nosec }}-${{ inputs.nodebug }}-${{ hashFiles('arch/arm64/configs/**', 'drivers/**', 'kernel/**', 'fs/**', 'block/**', 'crypto/**', 'net/**') }}
          restore-keys: |
            out-${{ matrix.device }}-${{ matrix.profile }}-

      - name: Setup KernelSU
        if: ${{ inputs.ksu }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash
          echo "CONFIG_KSU=y" > $GITHUB_WORKSPACE/arch/arm64/configs/ksu.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/ksu.config

      - name: Setup WireGuard
        if: ${{ inputs.wireguard }}
        run: |
          git clone --depth 1 https://github.com/WireGuard/wireguard-linux-compat.git
          ./wireguard-linux-compat/kernel-tree-scripts/jury-rig.sh $(pwd)
          # This tree backported __kernel_timespec-as-macro from 5.x, so the
          # compat <4.18 struct redefinition collides; skip it when present.
          perl -0pi -e 's/#if LINUX_VERSION_CODE < KERNEL_VERSION\(4, 18, 0\)\nstruct __kernel_timespec \{/#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 18, 0) \&\& !defined(__kernel_timespec)\nstruct __kernel_timespec {/' net/wireguard/compat/compat.h
          grep -n "__kernel_timespec" net/wireguard/compat/compat.h | head

      - name: Compile Kernel
        run: |
          if [ "${{ inputs.use_cache }}" != "true" ]; then
            rm -rf out
            make clean 2>/dev/null || true
            make mrproper 2>/dev/null || true
          else
            echo "use_cache: keeping previous out/ for incremental build"
          fi
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          export TC=$GITHUB_WORKSPACE/clang
          export CROSS_COMPILE=$TC/bin/aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=$TC/bin/arm-linux-gnueabi-
          export LD=$TC/bin/ld.lld
          export CC=$TC/bin/clang
          export ARCH=arm64
          export KCFLAGS=" -w -pipe -${{ inputs.opt }}"
          export KCPPFLAGS=" -${{ inputs.opt }}"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export CFGDIR=arch/arm64/configs
          rm -f $CFGDIR/compiled_defconfig
          cat $CFGDIR/mt6768_lucreticus_defconfig $CFGDIR/${{ env.DEVICE_CHOICE }}.config > $CFGDIR/compiled_defconfig
          if [ "${{ matrix.profile }}" != "balance" ]; then
            cat $CFGDIR/${{ matrix.profile }}.config >> $CFGDIR/compiled_defconfig
          fi
          if [ "${{ inputs.ksu }}" = "true" ]; then
            cat $CFGDIR/ksu.config >> $CFGDIR/compiled_defconfig
          fi
          if [ "${{ inputs.nomount }}" != "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_NOMOUNT
          fi
          if [ "${{ inputs.droidspaces }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_SYSVIPC \
              --enable CONFIG_POSIX_MQUEUE \
              --enable CONFIG_IPC_NS \
              --enable CONFIG_USER_NS \
              --enable CONFIG_CGROUP_NET_PRIO \
              --enable CONFIG_DEVTMPFS \
              --enable CONFIG_TMPFS_POSIX_ACL \
              --enable CONFIG_TMPFS_XATTR \
              --enable CONFIG_NF_TABLES \
              --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          else
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_SYSVIPC \
              --disable CONFIG_POSIX_MQUEUE \
              --disable CONFIG_IPC_NS \
              --disable CONFIG_USER_NS \
              --disable CONFIG_CGROUP_NET_PRIO \
              --disable CONFIG_DEVTMPFS \
              --disable CONFIG_TMPFS_POSIX_ACL \
              --disable CONFIG_TMPFS_XATTR \
              --disable CONFIG_NF_TABLES \
              --disable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          fi
          if [ "${{ inputs.lto }}" = "thin" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_LTO_CLANG \
              --enable CONFIG_THINLTO
          elif [ "${{ inputs.lto }}" = "full" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_LTO_CLANG \
              --disable CONFIG_THINLTO
          else
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_LTO_CLANG \
              --disable CONFIG_THINLTO \
              --enable CONFIG_LTO_NONE
          fi
          if [ "${{ inputs.zen }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_IOSCHED_ZEN \
              --enable CONFIG_DEFAULT_ZEN
          fi
          if [ "${{ inputs.aio_opt }}" != "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_AIO_OPTIMIZE
          fi
          if [ "${{ inputs.wireguard }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_WIREGUARD \
              --enable CONFIG_NET_UDP_TUNNEL \
              --enable CONFIG_DST_CACHE \
              --enable CONFIG_CRYPTO_ALGAPI
          fi
          if [ "${{ inputs.nosec }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_TZDEV \
              --disable CONFIG_TEEGRIS_TEE_SUPPORT
          fi
          if [ "${{ inputs.nodebug }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_DYNAMIC_DEBUG \
              --disable CONFIG_DEBUG_INFO \
              --disable CONFIG_SCHED_DEBUG \
              --disable CONFIG_DEBUG_LIST \
              --disable CONFIG_FTRACE \
              --disable CONFIG_MAGIC_SYSRQ \
              --disable CONFIG_KALLSYMS_ALL
          fi
          if [ "${{ inputs.bypass_charging }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_MTK_BYPASS_CHARGING
          else
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_MTK_BYPASS_CHARGING
          fi
          if [ "${{ inputs.docker }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_CFS_BANDWIDTH \
              --enable CONFIG_CGROUP_HUGETLB \
              --enable CONFIG_NET_CLS_CGROUP \
              --enable CONFIG_MACVLAN \
              --enable CONFIG_VXLAN \
              --enable CONFIG_BRIDGE_VLAN_FILTERING \
              --enable CONFIG_BTRFS_FS
          else
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_CFS_BANDWIDTH \
              --disable CONFIG_CGROUP_HUGETLB \
              --disable CONFIG_NET_CLS_CGROUP \
              --disable CONFIG_MACVLAN \
              --disable CONFIG_VXLAN \
              --disable CONFIG_BRIDGE_VLAN_FILTERING \
              --disable CONFIG_BTRFS_FS
          fi
          if [ "${{ inputs.clock }}" = "overclock" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_LUCRETICUS_OC_GPU \
              --enable CONFIG_LUCRETICUS_OC_CCI \
              --enable CONFIG_LUCRETICUS_OC_RAMDVFS \
              --disable CONFIG_LUCRETICUS_UV
          elif [ "${{ inputs.clock }}" = "downclock" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_LUCRETICUS_UV \
              --disable CONFIG_LUCRETICUS_OC_GPU \
              --disable CONFIG_LUCRETICUS_OC_CCI \
              --disable CONFIG_LUCRETICUS_OC_RAMDVFS
          else
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_LUCRETICUS_OC_GPU \
              --disable CONFIG_LUCRETICUS_OC_CCI \
              --disable CONFIG_LUCRETICUS_OC_RAMDVFS \
              --disable CONFIG_LUCRETICUS_UV
          fi
          case "${{ inputs.hz }}" in
            100) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_HZ_100 --disable CONFIG_HZ_250 --disable CONFIG_HZ_300 --disable CONFIG_HZ_1000 --set-val CONFIG_HZ 100 ;;
            250) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_HZ_250 --disable CONFIG_HZ_100 --disable CONFIG_HZ_300 --disable CONFIG_HZ_1000 --set-val CONFIG_HZ 250 ;;
            300) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_HZ_300 --disable CONFIG_HZ_100 --disable CONFIG_HZ_250 --disable CONFIG_HZ_1000 --set-val CONFIG_HZ 300 ;;
            1000) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_HZ_1000 --disable CONFIG_HZ_100 --disable CONFIG_HZ_250 --disable CONFIG_HZ_300 --set-val CONFIG_HZ 1000 ;;
          esac
          case "${{ inputs.gpu_clock }}" in
            overclock) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_LUCRETICUS_OC_GPU ;;
            downclock) scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_LUCRETICUS_OC_GPU ;;
            max) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_LUCRETICUS_OC_GPU --enable CONFIG_LUCRETICUS_OC_CCI --enable CONFIG_LUCRETICUS_OC_RAMDVFS ;;
            *) scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_LUCRETICUS_OC_GPU ;;
          esac
          echo '' >> $CFGDIR/compiled_defconfig
          echo '# CONFIG_ALWAYS_ENFORCE is not set' >> $CFGDIR/compiled_defconfig
          echo 'CONFIG_ALWAYS_PERMISSIVE=y' >> $CFGDIR/compiled_defconfig
          echo 'CONFIG_MTK_GPU_VERSION="mali valhall r32p1"' >> $CFGDIR/compiled_defconfig
          make -C $(pwd) O=$(pwd)/out -j$(nproc) compiled_defconfig
          make -s -C $(pwd) O=$(pwd)/out -j$(nproc)

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/stardustps/sta7dust.git sta7dust
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz sta7dust/
          elif [ -f out/arch/arm64/boot/Image ]; then
            gzip -9 -c out/arch/arm64/boot/Image > sta7dust/Image.gz
          else
            echo "Kernel Image not found!"
            exit 1
          fi

      - name: Create Flashable Zip
        run: |
          cd sta7dust
          SUFFIX="${{ matrix.profile }}-${{ inputs.opt }}"
          if [ "${{ inputs.ksu }}" = "true" ]; then
            SUFFIX="$SUFFIX-ksu"
          fi
          if [ "${{ inputs.droidspaces }}" = "true" ]; then
            SUFFIX="$SUFFIX-ds"
          fi
          if [ "${{ inputs.nomount }}" = "true" ]; then
            SUFFIX="$SUFFIX-nm"
          fi
          if [ "${{ inputs.zen }}" = "true" ]; then
            SUFFIX="$SUFFIX-zen"
          fi
          if [ "${{ inputs.aio_opt }}" != "true" ]; then
            SUFFIX="$SUFFIX-noaioopt"
          fi
          if [ "${{ inputs.use_cache }}" = "true" ]; then
            SUFFIX="$SUFFIX-cache"
          fi
          if [ "${{ inputs.bypass_charging }}" = "true" ]; then
            SUFFIX="$SUFFIX-bypass"
          fi
          if [ "${{ inputs.docker }}" = "true" ]; then
            SUFFIX="$SUFFIX-docker"
          fi
          if [ "${{ inputs.clock }}" = "overclock" ]; then
            SUFFIX="$SUFFIX-oc"
          elif [ "${{ inputs.clock }}" = "downclock" ]; then
            SUFFIX="$SUFFIX-uv"
          fi
          SUFFIX="$SUFFIX-${{ inputs.hz }}hz"
          if [ "${{ inputs.gpu_clock }}" != "stock" ]; then
            SUFFIX="$SUFFIX-gpu${{ inputs.gpu_clock }}"
          fi
          if [ "${{ inputs.wireguard }}" = "true" ]; then
            SUFFIX="$SUFFIX-wg"
          fi
          if [ "${{ inputs.nosec }}" = "true" ]; then
            SUFFIX="$SUFFIX-nosec"
          fi
          if [ "${{ inputs.nodebug }}" = "true" ]; then
            SUFFIX="$SUFFIX-nodebug"
          fi
          if [ "${{ inputs.lto }}" = "thin" ]; then
            SUFFIX="$SUFFIX-thinlto"
          elif [ "${{ inputs.lto }}" = "full" ]; then
            SUFFIX="$SUFFIX-fulllto"
          fi
          zip -r9 ../lucreticus-r1-Armaros-${{ env.DEVICE_CHOICE }}-$SUFFIX-${{ env.SHORT_SHA }}.zip * -x .git README.md *placeholder
          ls -lh ../lucreticus-r1-Armaros-*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucreticus-r1-Armaros-${{ env.DEVICE_CHOICE }}-${{ matrix.profile }}-${{ inputs.ksu && 'ksu' || 'standard' }}
          path: lucreticus-r1-Armaros-*.zip

  notify:
    name: Telegram summary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Send Telegram summary
        run: |
          cd builds
          shopt -s nullglob
          ZIPS=(lucreticus-r1-Armaros-*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "error: no lucreticus zips downloaded, refusing to send an empty notification"
            exit 1
          fi
          if [ "${{ inputs.ksu }}" = "true" ]; then KSU_STATUS="yes"; else KSU_STATUS="no"; fi
          if [ "${{ inputs.droidspaces }}" = "true" ]; then DS_STATUS="yes"; else DS_STATUS="no"; fi
          if [ "${{ inputs.nomount }}" = "true" ]; then NM_STATUS="yes"; else NM_STATUS="no"; fi
          if [ "${{ inputs.zen }}" = "true" ]; then ZEN_STATUS="zen"; else ZEN_STATUS="cfq"; fi
          if [ "${{ inputs.aio_opt }}" = "true" ]; then AIO_STATUS="yes"; else AIO_STATUS="no"; fi
          if [ "${{ inputs.wireguard }}" = "true" ]; then WG_STATUS="yes"; else WG_STATUS="no"; fi
          if [ "${{ inputs.nosec }}" = "true" ]; then SEC_STATUS="stripped"; else SEC_STATUS="kept"; fi
          if [ "${{ inputs.nodebug }}" = "true" ]; then DBG_STATUS="stripped"; else DBG_STATUS="full"; fi
          if [ "${{ inputs.use_cache }}" = "true" ]; then CACHE_STATUS="yes"; else CACHE_STATUS="no"; fi
          if [ "${{ inputs.bypass_charging }}" = "true" ]; then BYPASS_STATUS="yes"; else BYPASS_STATUS="no"; fi
          if [ "${{ inputs.docker }}" = "true" ]; then DOCKER_STATUS="yes"; else DOCKER_STATUS="no"; fi
          CLOCK_STATUS="${{ inputs.clock }}"
          HZ_STATUS="${{ inputs.hz }}"
          GPU_CLOCK_STATUS="${{ inputs.gpu_clock }}"
          LIST=""
          COUNT=0
          for ZIP in lucreticus-r1-Armaros-*.zip; do
            MD5=$(md5sum "$ZIP" | cut -d ' ' -f 1)
            REST=${ZIP#lucreticus-r1-Armaros-}
            DEV=${REST%%-*}
            REST2=${REST#*-}
            PROF=${REST2%%-*}
            COUNT=$((COUNT + 1))
            LIST=$(printf '%s\n- %s %s — md5: %s' "$LIST" "$DEV" "$PROF" "$MD5")
            echo "$ZIP $MD5" >> files.txt
          done
          TEXT=$(printf '<i>build successfully.</i>\n\nlucreticus kernel (%s builds)\n\nkernel version: 5.10.239 (spoofed)\nlucreticus patch version: r1-Armaros\n\ncompiler: ZyC Clang 14 -%s\nlto: %s\nkernelsu integrated: %s\ndroidspaces: %s\nnomount: %s\niosched: %s\naio optimized: %s\nwireguard: %s\nsamsung security: %s\ndebug: %s\ncache: %s\nbypass charging: %s\ndocker: %s\nclock: %s\ntick: %sHz\ngpu clock: %s\ncommit: %s\n%s' "$COUNT" "${{ inputs.opt }}" "${{ inputs.lto }}" "$KSU_STATUS" "$DS_STATUS" "$NM_STATUS" "$ZEN_STATUS" "$AIO_STATUS" "$WG_STATUS" "$SEC_STATUS" "$DBG_STATUS" "$CACHE_STATUS" "$BYPASS_STATUS" "$DOCKER_STATUS" "$CLOCK_STATUS" "$HZ_STATUS" "$GPU_CLOCK_STATUS" "${{ github.sha }}" "$LIST")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$TEXT"
          while read -r ZIP MD5; do
            [ -n "$ZIP" ] || continue
            CAP=$(printf '%s\nmd5: %s' "$ZIP" "$MD5")
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F document=@"$ZIP" \
              -F parse_mode=HTML \
              -F caption="$CAP"
          done < files.txt
